<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Enquiry Chatbot</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</head>
<body>
  <div class="chatbox">
    
    <div class="chatbox-header">
      <h2>Astro Bot</h2>
    </div>
    <div id="chatlog">
      <div class="bot-message">
        <p>Hii i am Astro Bot!,How can I assist you today? If you want to know about my abilities, type QUERIES </p>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="textInput" placeholder="Ask something..." onkeyup="if(event.keyCode === 13) sendMessage()">
      <button onclick="sendMessage()" aria-label="Send Message">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>


  <script>
   function sendMessage() {
            let rawText = $("#textInput").val();
            console.log("Sending message to backend:", rawText);
           
            let userHtml = '<p class="user-message"><span>' + rawText + '</span></p>';
            $("#textInput").val(""); 
            $("#chatlog").append(userHtml);
            document.getElementById('textInput').scrollIntoView({ block: 'start', behavior: 'smooth' });
      

            // This URL is now corrected to match your app.py
            $.post("/get_response", { msg: rawText }).done(function(data) {
              console.log("Received from backend:", data);
                var botHtml = '<p class="bot-message"><span>' + data + '</span></p>';
                $("#chatlog").append(botHtml);
                document.getElementById('textInput').scrollIntoView({ block: 'start', behavior: 'smooth' });
            });
        }
        $("#textInput").keypress(function(e) {
            if (e.which == 13) {
                sendMessage();
            }
        });
        $("#buttonInput").click(function() {
            sendMessage();
        });
      
    
  </script>
</body>
</html>
